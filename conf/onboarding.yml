# ---------------------------------------------------------------- retail_sales
- data_flow_id: "201"
  data_flow_group: retail_sales
  source_system: retail_org
  source_format: cloudFiles
  source_details:
    source_database: retail_org
    source_table: sales_orders
    source_path_dev: "/Volumes/mg_aws_serverless_workspace_catalog/sdp_meta_landing/files/retail_sales/sales_orders/"
    source_metadata:
      include_autoloader_metadata_column: "True"
      autoloader_metadata_col_name: source_metadata
      select_metadata_cols:
        input_file_name: _metadata.file_name
  bronze_database_dev: "mg_aws_serverless_workspace_catalog.sdp_meta_bronze"
  bronze_table: sales_orders
  bronze_table_comment: "Raw sales orders (nested JSON, includes order revisions)"
  bronze_reader_options:
    cloudFiles.format: "json"
    cloudFiles.inferColumnTypes: "true"
    cloudFiles.rescuedDataColumn: "_rescued_data"
  bronze_table_properties:
    quality: "bronze"
  bronze_cluster_by_auto: true
  bronze_data_quality_expectations_json_dev: "${workspace.file_path}/conf/dqe/sales_orders/bronze_expectations.yml"
  bronze_database_quarantine_dev: "mg_aws_serverless_workspace_catalog.sdp_meta_bronze"
  bronze_quarantine_table: sales_orders_quarantine

- data_flow_id: "202"
  data_flow_group: retail_sales
  source_system: retail_org
  source_format: cloudFiles
  source_details:
    source_database: retail_org
    source_table: sales_stream
    source_path_dev: "/Volumes/mg_aws_serverless_workspace_catalog/sdp_meta_landing/files/retail_sales/sales_stream/"
    source_metadata:
      include_autoloader_metadata_column: "True"
      autoloader_metadata_col_name: source_metadata
      select_metadata_cols:
        input_file_name: _metadata.file_name
  bronze_database_dev: "mg_aws_serverless_workspace_catalog.sdp_meta_bronze"
  bronze_table: sales_stream
  bronze_table_comment: "Raw streaming sales events, one small JSON file per 5 minutes"
  bronze_reader_options:
    cloudFiles.format: "json"
    cloudFiles.inferColumnTypes: "true"
    cloudFiles.rescuedDataColumn: "_rescued_data"
  bronze_table_properties:
    quality: "bronze"
  bronze_cluster_by_auto: true
  bronze_data_quality_expectations_json_dev: "${workspace.file_path}/conf/dqe/sales_stream/bronze_expectations.yml"
  bronze_database_quarantine_dev: "mg_aws_serverless_workspace_catalog.sdp_meta_bronze"
  bronze_quarantine_table: sales_stream_quarantine

# Silver-only row (features #6 + #10): ONE silver `orders` table fed by BOTH bronze sources
# via multi-source AUTO CDC. Each flow normalises its own shape of ordered_products
# (struct array vs. positional string array) into one schema; SCD1 on order_number keeps the
# latest revision of each order (sales_orders has 74 revised orders, sales_stream has 1).
- data_flow_id: "203"
  data_flow_group: retail_sales
  silver_database_dev: "mg_aws_serverless_workspace_catalog.sdp_meta_silver"
  silver_table: orders
  silver_table_comment: "Orders from batch + streaming channels, latest revision per order"
  silver_table_properties:
    quality: "silver"
    delta.enableChangeDataFeed: "true"
  silver_transformation_json_dev: "${workspace.file_path}/conf/silver_transformations/retail_sales.yml"
  silver_cdc_apply_changes_flows:
    keys:
      - order_number
    sequence_by: sequence_ts
    scd_type: "1"
    except_column_list:
      - sequence_ts
    flows:
      - name: orders_from_sales_orders
        source_format: delta
        source_details:
          source_catalog: mg_aws_serverless_workspace_catalog
          source_database: sdp_meta_bronze
          source_table: sales_orders
        select_exp:
          - "order_number"
          - "CAST(customer_id AS STRING) AS customer_id"
          - "customer_name"
          - "CAST(from_unixtime(try_cast(order_datetime AS BIGINT)) AS TIMESTAMP) AS order_ts"
          - "CAST(number_of_line_items AS INT) AS number_of_line_items"
          - "transform(ordered_products, p -> named_struct('product_id', p.id, 'product_name', p.name, 'currency', p.curr, 'price', CAST(p.price AS DOUBLE), 'qty', CAST(p.qty AS INT), 'unit', p.unit, 'promo_id', CAST(p.promotion_info.promo_id AS INT), 'promo_disc', CAST(p.promotion_info.promo_disc AS DOUBLE))) AS order_lines"
          - "'sales_orders' AS source_channel"
          - "try_cast(order_datetime AS BIGINT) AS sequence_ts"
      - name: orders_from_sales_stream
        source_format: delta
        source_details:
          source_catalog: mg_aws_serverless_workspace_catalog
          source_database: sdp_meta_bronze
          source_table: sales_stream
        select_exp:
          - "order_number"
          - "CAST(customer_id AS STRING) AS customer_id"
          - "customer_name"
          - "CAST(from_unixtime(try_cast(order_datetime AS BIGINT)) AS TIMESTAMP) AS order_ts"
          - "CAST(number_of_line_items AS INT) AS number_of_line_items"
          - "transform(ordered_products, p -> named_struct('product_id', p[1], 'product_name', p[2], 'currency', p[0], 'price', CAST(p[3] AS DOUBLE), 'qty', CAST(p[4] AS INT), 'unit', p[5], 'promo_id', CAST(NULL AS INT), 'promo_disc', CAST(NULL AS DOUBLE))) AS order_lines"
          - "'sales_stream' AS source_channel"
          - "try_cast(order_datetime AS BIGINT) AS sequence_ts"
